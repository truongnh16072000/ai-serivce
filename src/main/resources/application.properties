spring.application.name=ai-service
spring.mvc.problemdetails.enabled=true

# The CLI inherits CODEX_HOME for authentication, while user configuration is ignored.
app.codex.executable=${CODEX_EXECUTABLE:codex}
app.codex.workspace-root=${CODEX_WORKSPACE_ROOT:${java.io.tmpdir}/ai-service-codex}
app.codex.timeout=${CODEX_TIMEOUT:5m}
app.codex.max-concurrent-requests=${CODEX_MAX_CONCURRENT_REQUESTS:16}
app.codex.max-output-bytes=${CODEX_MAX_OUTPUT_BYTES:1048576}
