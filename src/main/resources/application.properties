spring.application.name=ai-service
spring.mvc.problemdetails.enabled=true
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:${java.io.tmpdir}/ai-service-db/conversations;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:6}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=${IMAGE_MAX_REFERENCE_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${IMAGE_MAX_REFERENCE_REQUEST_SIZE:52MB}

app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.default-chat-id=${TELEGRAM_DEFAULT_CHAT_ID:}
app.telegram.timeout=${TELEGRAM_TIMEOUT:10s}
app.telegram.async-threads=${TELEGRAM_ASYNC_THREADS:1}
app.telegram.queue-capacity=${TELEGRAM_QUEUE_CAPACITY:100}

# The CLI inherits CODEX_HOME for authentication, while user configuration is ignored.
app.codex.executable=${CODEX_EXECUTABLE:codex}
app.codex.workspace-root=${CODEX_WORKSPACE_ROOT:${java.io.tmpdir}/ai-service-codex}
app.codex.generated-images-root=${CODEX_GENERATED_IMAGES_ROOT:${CODEX_HOME:${user.home}/.codex}/generated_images}
app.codex.timeout=${CODEX_TIMEOUT:5m}
app.codex.max-concurrent-requests=${CODEX_MAX_CONCURRENT_REQUESTS:16}
app.codex.max-output-bytes=${CODEX_MAX_OUTPUT_BYTES:1048576}
app.codex.max-image-output-bytes=${CODEX_MAX_IMAGE_OUTPUT_BYTES:26214400}
