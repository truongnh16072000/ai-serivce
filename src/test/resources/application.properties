spring.datasource.url=jdbc:h2:mem:ai_service_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=52MB
app.codex.executable=codex
app.codex.workspace-root=${java.io.tmpdir}/ai-service-test-codex
app.codex.generated-images-root=${java.io.tmpdir}/ai-service-test-codex-images
app.codex.timeout=5s
app.codex.chat-model=test-chat-model
app.codex.chat-effort=low
app.codex.max-concurrent-chat-requests=2
app.codex.max-concurrent-image-requests=1
app.codex.max-output-bytes=1048576
app.codex.max-image-output-bytes=26214400
